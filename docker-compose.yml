services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.${APP_ENV}
    env_file:
      - .env
    environment:
      HF_HOME: /models/cache/huggingface
      FASTEMBED_CACHE_PATH: /models/cache/fastembed
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./models/multilingual-e5-base:/models/multilingual-e5-base:ro
      - model_cache:/models/cache
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.${APP_ENV}
    env_file:
      - .env
    environment:
      HF_HOME: /models/cache/huggingface
      FASTEMBED_CACHE_PATH: /models/cache/fastembed
    command: python -m app.worker
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./models/multilingual-e5-base:/models/multilingual-e5-base:ro
      - model_cache:/models/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
